name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff@0.15.20 check app dags
      - run: uvx ruff@0.15.20 format --check app dags

  test-app:
    name: Test app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: app
      - run: uv run --group dev pytest -q
        working-directory: app

  test-dags:
    name: Test DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
        working-directory: dags
      - run: uv run --group dev pytest -q
        working-directory: dags

  build:
    name: Build & package image
    runs-on: ubuntu-latest
    needs: [lint, test-app, test-dags]
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: app
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastapi-app:latest
            ghcr.io/${{ github.repository_owner }}/fastapi-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (schema-validate k8s/)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz
          ./kubeconform -strict -summary k8s/

  e2e-kind:
    name: E2E on Kind
    runs-on: ubuntu-latest
    needs: [lint, test-app, test-dags]
    steps:
      - uses: actions/checkout@v4
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: dataops
      - name: Build image
        run: docker build -t fastapi-app:dev app/
      - name: Load image into Kind
        run: kind load docker-image fastapi-app:dev --name dataops
      - name: Deploy manifests and wait for rollout
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deploy/fastapi-app --timeout=120s
      - name: Setup Kubernetes port-forward
        uses: vbem/k8s-port-forward@v1
        with:
          workload: "svc/fastapi-app"
          mappings: "8000:80"
      - name: Smoke-test the running app
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf -X POST http://localhost:8000/pipeline/run | tee /dev/stderr | grep -q '"rows"'
          curl -sf http://localhost:8000/pipeline/result | tee /dev/stderr | grep -q '"rows"'
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe deploy/fastapi-app
          kubectl logs -l app=fastapi-app --tail=50 || true
